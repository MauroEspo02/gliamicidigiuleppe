<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Qui riposano gli ex membri del gruppo Gli amici di Giuleppe.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05060b">
<meta property="og:title" content="Cimitero di Giuleppe">
<meta property="og:description" content="Qui riposano gli ex membri del gruppo Gli amici di Giuleppe. Porta un fiore.">
<meta property="og:image" content="/og.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Pixelify+Sans:wght@400;500;600;700&family=VT323&family=Caveat:wght@600&display=swap">
<style>
/* Notte di temporale: scena pixel art a schermo intero, lapidi in fila su un sentiero che scorre in orizzontale */
:root{
  --notte:#05060b;
  --osso:#e9e2c8;
  --osso-scuro:#b7ae92;
  --legno:#6b3f22;
  --legno-scuro:#2a1609;
  --ferro:#151826;
  --lampo:#d9e0ff;
  --ruggine:#b5473c;
  --oro:#f3d47e;
  --oro-2:#d9b862;
  --f-titolo:"Jacquard 24","Pixelify Sans",ui-serif,serif;
  --f-pixel:"Pixelify Sans","VT323",ui-monospace,monospace;
  --f-testo:"VT323",ui-monospace,monospace;
  --px:3px;
  --zpx:4px;
  --suolo:40;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--notte);color:var(--osso)}
body{font-family:var(--f-testo);font-size:18px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
canvas.scena{position:fixed;left:0;top:0;pointer-events:none;image-rendering:pixelated}
#fondo{z-index:0}
#pioggia{z-index:2}
#lampo{position:fixed;inset:0;z-index:3;pointer-events:none;background:var(--lampo);mix-blend-mode:screen;opacity:0}

/* ---------- il cimitero che scorre ---------- */
#cimitero{position:fixed;inset:0;z-index:1;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;outline:none;cursor:grab}
#cimitero::-webkit-scrollbar{display:none}
#cimitero.trascina{cursor:grabbing}
#cimitero.trascina .lapide{pointer-events:none}
@media (pointer:coarse){#cimitero{scroll-snap-type:x proximity}.lapide,.posto-libero,.chiosco,.teatro{scroll-snap-align:center}}
#fila{position:relative;display:flex;align-items:flex-end;height:100%;width:max-content;min-width:100%;
  padding-left:calc(50vw - var(--px)*28);padding-right:calc(50vw - var(--px)*28);
  padding-bottom:calc(var(--px)*(var(--suolo) - 5))}
#recinto{position:absolute;left:0;right:0;bottom:calc(var(--px)*(var(--suolo) - 4));height:calc(var(--px)*28);
  background-image:var(--tile-recinto);background-repeat:repeat-x;background-size:calc(var(--px)*12) calc(var(--px)*28);image-rendering:pixelated}
#suolo{position:absolute;left:0;right:0;bottom:0;height:calc(var(--px)*var(--suolo));background-color:#100a06;
  background-image:var(--tile-suolo);background-repeat:repeat-x;background-size:calc(var(--px)*64) calc(var(--px)*48);image-rendering:pixelated}

.lapide{position:relative;flex:none;width:calc(var(--px)*56);height:calc(var(--px)*82);z-index:1;transition:filter .15s steps(2)}
.lapide .pietra,.prop canvas,.posto-libero canvas{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated}
.lapide .foto{position:absolute;left:calc(var(--px)*18);top:calc(var(--px)*16);width:calc(var(--px)*20);height:calc(var(--px)*24);overflow:hidden;background:#0b0c12}
.foto img{display:block;width:100%;height:100%;object-fit:cover;filter:grayscale(.45) sepia(.25) contrast(1.05) brightness(.92)}
.foto img.pix{image-rendering:pixelated}
.lapide .nome,.lapide .data,.lapide .morte{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;font-family:var(--f-pixel);font-weight:700}
.lapide .nome{left:calc(var(--px)*10);top:calc(var(--px)*42);width:calc(var(--px)*36);height:calc(var(--px)*10);
  font-size:calc(var(--px)*4.6);line-height:1;color:var(--oro);text-shadow:0 2px 0 #000;overflow-wrap:anywhere}
.lapide .data{left:calc(var(--px)*10);top:calc(var(--px)*52);width:calc(var(--px)*36);height:calc(var(--px)*6);
  font-size:calc(var(--px)*3.6);font-weight:600;color:var(--oro-2);text-shadow:0 1px 0 #000;white-space:nowrap;font-variant-numeric:tabular-nums}
.lapide .morte{left:calc(var(--px)*10);top:calc(var(--px)*61);width:calc(var(--px)*36);height:calc(var(--px)*7);
  font-size:calc(var(--px)*3.5);letter-spacing:.08em;text-transform:uppercase;color:#f6eed6;text-shadow:0 1px 0 #000;white-space:nowrap}
.morte.impiccato,.z-causa.impiccato{background:#7a2124;box-shadow:inset 0 var(--u,var(--px)) 0 #a8403c,inset 0 calc(var(--u,var(--px))*-1) 0 #3d0d0f,0 0 0 var(--u,var(--px)) #120405}
.morte.suicidato,.z-causa.suicidato{background:#253a6e;box-shadow:inset 0 var(--u,var(--px)) 0 #4060a3,inset 0 calc(var(--u,var(--px))*-1) 0 #101a36,0 0 0 var(--u,var(--px)) #04070f}
.lapide:hover,.lapide:focus-visible{filter:brightness(1.18)}
.lapide:focus-visible{outline:none}
.lapide:focus-visible::after{content:"";position:absolute;inset:calc(var(--px)*-2);border:var(--px) dashed var(--osso)}
.lapide .corvo{position:absolute;width:calc(var(--px)*12);height:calc(var(--px)*9);left:calc(var(--px)*22);top:calc(var(--px)*-8);image-rendering:pixelated}
.prop{position:relative;flex:none;pointer-events:none}
.prop .alone{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,190,90,.38),rgba(255,150,60,.12) 45%,transparent 70%);animation:fiamma 2.6s steps(1) infinite}
@keyframes fiamma{0%{opacity:.9}17%{opacity:.7}23%{opacity:1}48%{opacity:.8}71%{opacity:.95}88%{opacity:.65}}
.posto-libero{position:relative;flex:none;width:calc(var(--px)*56);height:calc(var(--px)*82)}
.posto-libero p{position:absolute;left:50%;top:calc(var(--px)*6);transform:translateX(-50%);margin:0;width:max-content;max-width:60vw;
  font-family:var(--f-pixel);font-size:calc(var(--px)*4);color:var(--osso-scuro);text-align:center;line-height:1.1;text-shadow:0 2px 0 #000}

/* ---------- insegna di legno ---------- */
#insegna{position:fixed;left:50%;top:0;z-index:4;transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;align-items:center;
  padding-top:env(safe-area-inset-top,0px);width:max-content;max-width:94vw}
#insegna .catene{display:flex;justify-content:space-between;width:70%;height:calc(var(--px)*9)}
#insegna .catene i{display:block;width:calc(var(--px)*4);height:100%;background-image:var(--tile-catena);background-size:calc(var(--px)*4) calc(var(--px)*8);background-position:bottom;image-rendering:pixelated}
.cartello{position:relative;filter:drop-shadow(var(--px) 0 0 #120a04) drop-shadow(calc(var(--px)*-1) 0 0 #120a04) drop-shadow(0 var(--px) 0 #120a04) drop-shadow(0 calc(var(--px)*-1) 0 #120a04) drop-shadow(0 calc(var(--px)*3) 0 rgba(0,0,0,.55))}
.tavola{position:relative;padding:calc(var(--px)*3) calc(var(--px)*7) calc(var(--px)*4);background-image:var(--tile-legno);background-size:calc(var(--px)*40) calc(var(--px)*24);image-rendering:pixelated;
  clip-path:polygon(0 calc(var(--px)*2),var(--px) calc(var(--px)*2),var(--px) var(--px),calc(var(--px)*2) var(--px),calc(var(--px)*2) 0,calc(100% - var(--px)*2) 0,calc(100% - var(--px)*2) var(--px),calc(100% - var(--px)) var(--px),calc(100% - var(--px)) calc(var(--px)*2),100% calc(var(--px)*2),100% calc(100% - var(--px)*2),calc(100% - var(--px)) calc(100% - var(--px)*2),calc(100% - var(--px)) calc(100% - var(--px)),calc(100% - var(--px)*2) calc(100% - var(--px)),calc(100% - var(--px)*2) 100%,calc(var(--px)*2) 100%,calc(var(--px)*2) calc(100% - var(--px)),var(--px) calc(100% - var(--px)),var(--px) calc(100% - var(--px)*2),0 calc(100% - var(--px)*2))}
.tavola h1{margin:0;font-family:var(--f-titolo);font-weight:400;font-size:clamp(34px,10.5vw,68px);line-height:.9;text-align:center;text-wrap:balance;color:var(--legno-scuro);
  text-shadow:0 2px 0 rgba(232,170,104,.55),0 -1px 0 rgba(0,0,0,.55);letter-spacing:.01em}
.chiodo{position:absolute;width:calc(var(--px)*2);height:calc(var(--px)*2);background:#8f8a7e;box-shadow:inset calc(var(--px)*-1) calc(var(--px)*-1) 0 #3a352c}
.chiodo.a{left:calc(var(--px)*3);top:calc(var(--px)*3)}.chiodo.b{right:calc(var(--px)*3);top:calc(var(--px)*3)}
.chiodo.c{left:calc(var(--px)*3);bottom:calc(var(--px)*3)}.chiodo.d{right:calc(var(--px)*3);bottom:calc(var(--px)*3)}
.targa{margin-top:calc(var(--px)*3);padding:calc(var(--px)*1.5) calc(var(--px)*4);background:#262935;
  box-shadow:inset 0 var(--px) 0 #4a4f63,inset 0 calc(var(--px)*-1) 0 #12141c,0 0 0 var(--px) #07080d;
  font-family:var(--f-pixel);font-weight:600;font-size:calc(var(--px)*3.6);letter-spacing:.18em;text-transform:uppercase;color:#c9ccd9;text-shadow:0 2px 0 #000}
#insegna.cala{animation:cala .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes cala{from{transform:translate(-50%,-115%)}to{transform:translate(-50%,0)}}

/* ---------- comandi ---------- */
.btn-px{position:fixed;z-index:5;display:grid;place-items:center;width:44px;height:44px;background:#151722;color:var(--osso);
  box-shadow:inset 0 3px 0 #2c3042,inset 0 -3px 0 #0a0b11,0 0 0 3px #04050a}
.btn-px svg{width:24px;height:24px;shape-rendering:crispEdges}
.btn-px:focus-visible{outline:3px dashed var(--osso);outline-offset:3px}
.btn-px:active{box-shadow:inset 0 -3px 0 #2c3042,inset 0 3px 0 #0a0b11,0 0 0 3px #04050a}
#audio{right:14px;top:calc(env(safe-area-inset-top,0px) + 14px)}
.freccia{bottom:calc(var(--px)*(var(--suolo) + 36) - 22px)}
#sx{left:10px}#dx{right:10px}
.freccia[hidden]{display:none!important}
#conta{position:fixed;z-index:5;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);
  padding:6px 12px;background:rgba(10,7,4,.82);box-shadow:0 0 0 3px #04050a,inset 0 2px 0 #2b2116;
  font-family:var(--f-pixel);font-size:14px;letter-spacing:.04em;color:var(--osso-scuro);text-align:center}
#conta b{color:var(--osso);font-weight:700}
#conta .anteprima{display:inline-block;margin-left:8px;padding:0 5px;background:#3a2a12;color:#e8c27a;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
#hint{position:fixed;z-index:5;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);transform:translateX(-50%);
  font-family:var(--f-pixel);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--osso);text-shadow:0 2px 0 #000;
  animation:lampeggia 1.2s steps(2) infinite;pointer-events:none;transition:opacity .4s steps(4);width:max-content}
#hint.via{opacity:0}
@keyframes lampeggia{50%{opacity:.35}}

/* ---------- lapide zoomata ---------- */
#zoom{position:fixed;inset:0;z-index:10;overflow-y:auto;overscroll-behavior:contain}
#zoom .velo{position:fixed;inset:0;background:rgba(3,4,9,.8)}
#zoom .scena-zoom{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 60px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.z-lapide{position:relative;flex:none;width:calc(var(--zpx)*84);height:calc(var(--zpx)*138);transform-origin:0 0}
.z-lapide .pietra{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.z-lapide .foto{position:absolute;left:calc(var(--zpx)*29);top:calc(var(--zpx)*20);width:calc(var(--zpx)*26);height:calc(var(--zpx)*32);overflow:hidden;background:#0b0c12}
.z-testo{position:absolute;text-align:center}
.z-nome{left:calc(var(--zpx)*13);width:calc(var(--zpx)*58);top:calc(var(--zpx)*54);height:calc(var(--zpx)*9);display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:var(--f-pixel);font-weight:700;font-size:calc(var(--zpx)*5.8);line-height:1;color:var(--oro);text-shadow:0 2px 0 #000;overflow-wrap:anywhere}
.z-causa{--u:var(--zpx);left:calc(var(--zpx)*15);width:calc(var(--zpx)*54);top:calc(var(--zpx)*65);height:calc(var(--zpx)*7);display:flex;align-items:center;justify-content:center;gap:calc(var(--zpx)*1.5);
  font-family:var(--f-pixel);font-weight:700;font-size:calc(var(--zpx)*3.6);letter-spacing:.08em;text-transform:uppercase;color:#f6eed6;text-shadow:0 1px 0 #000;white-space:nowrap}
.z-causa svg{width:calc(var(--zpx)*4);height:calc(var(--zpx)*5);flex:none;shape-rendering:crispEdges}
.z-motivo{left:calc(var(--zpx)*15);width:calc(var(--zpx)*54);top:calc(var(--zpx)*74);height:calc(var(--zpx)*33);display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:var(--f-testo);font-size:calc(var(--zpx)*5);line-height:1;color:#17181e;text-wrap:pretty;user-select:text;-webkit-user-select:text}
.z-motivo p{margin:0}
.z-date{left:calc(var(--zpx)*17);width:calc(var(--zpx)*50);top:calc(var(--zpx)*110);height:calc(var(--zpx)*10);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--f-pixel);font-weight:600;font-size:calc(var(--zpx)*3.3);line-height:1.15;color:var(--oro-2);text-shadow:0 1px 0 #000}
.z-nav{position:relative;display:flex;align-items:center;gap:14px;font-family:var(--f-pixel);font-size:15px;color:var(--osso-scuro);font-variant-numeric:tabular-nums}
.z-nav .btn-px{position:static}
#chiudi{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:11}

.t-risposte{flex-direction:column;align-items:stretch}
.t-risposte .r-btn{text-align:left}

/* ---------- personaggi che camminano e fantasma ---------- */
.passante{position:absolute;left:0;z-index:2;padding:0;cursor:pointer;will-change:transform}
.passante .corpo{position:absolute;inset:0;transform:scaleX(var(--sx,1))}
.passante canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.passante:focus-visible{outline:3px dashed var(--osso);outline-offset:3px}
#fantasma{position:fixed;left:0;top:0;z-index:4;width:calc(var(--px)*22);height:calc(var(--px)*32);cursor:pointer;will-change:transform}
#fantasma .corpo-f{position:absolute;inset:0;transform:scaleX(var(--sx,1))}
#fantasma canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#fantasma .alone-fant{position:absolute;inset:calc(var(--px)*-9);border-radius:50%;background:radial-gradient(circle,rgba(150,180,255,.3),transparent 66%);pointer-events:none}

/* ---------- la fossa e il caffè ---------- */
.luce-fossa{position:absolute;left:calc(var(--px)*13);top:calc(var(--px)*30);width:calc(var(--px)*30);height:calc(var(--px)*50);cursor:pointer;pointer-events:auto}
.luce-fossa::before{content:"";position:absolute;left:0;right:0;top:0;bottom:calc(var(--px)*10);
  background:linear-gradient(to top,rgba(255,206,120,.5),rgba(255,190,100,.18) 55%,transparent);clip-path:polygon(0 0,100% 0,78% 100%,22% 100%);animation:fiamma 2.2s steps(1) infinite}
.luce-fossa::after{content:"";position:absolute;left:calc(var(--px)*-6);right:calc(var(--px)*-6);bottom:calc(var(--px)*-4);height:calc(var(--px)*22);border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,190,90,.45),transparent 65%)}
.luce-fossa:hover::before,.luce-fossa:focus-visible::before{filter:brightness(1.4)}
.luce-fossa:focus-visible{outline:3px dashed var(--osso);outline-offset:2px}
#chiedi{align-items:center;z-index:13}
.box-c{position:relative;width:min(380px,100%);padding:18px;background:#efe6c8;color:#1d1a14;box-shadow:inset 0 0 0 3px #cdbd92,0 0 0 3px #06060b,0 0 0 7px #6b4a2a,0 0 0 10px #06060b}
.box-c h2{margin:0;font-family:var(--f-pixel);font-weight:700;font-size:18px;text-wrap:balance}
.box-c p{margin:8px 0 0;font-family:var(--f-testo);font-size:22px;line-height:1.05}
#caffe{position:fixed;inset:0;z-index:25;background:#0d0806;overflow:hidden}
#caffe canvas#caffe-cv{position:absolute;left:0;top:0;image-rendering:pixelated}
.insegna-caffe{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 13vh);transform:translateX(-50%) rotate(-3deg);display:flex;flex-direction:column;align-items:center;
  width:max-content;max-width:calc(100vw - 40px);padding:10px 18px 12px;background-image:var(--tile-legno);background-size:calc(var(--px)*40) calc(var(--px)*24);image-rendering:pixelated;
  box-shadow:0 0 0 3px #120a04,0 8px 0 3px rgba(0,0,0,.5)}
.insegna-caffe::before,.insegna-caffe::after{content:"";position:absolute;bottom:100%;width:3px;height:60vh;background:#0c0c10}
.insegna-caffe::before{left:18%}.insegna-caffe::after{right:18%}
.ic-1{font-family:var(--f-pixel);font-weight:700;font-size:clamp(13px,3.6vw,18px);letter-spacing:.28em;text-transform:uppercase;color:#ffe2a8;text-shadow:0 0 8px rgba(255,190,90,.7),0 2px 0 #2a1609}
.ic-2{font-family:var(--f-titolo);font-size:clamp(40px,12.5vw,84px);line-height:.95;color:#ffcf6b;text-align:center;text-shadow:0 0 14px rgba(255,170,60,.65),0 3px 0 #2a1609;animation:neon 6s steps(1) infinite}
@keyframes neon{0%,91%,95%{opacity:1}92%,94%{opacity:.35}}
#corvo-re{position:absolute;right:-6px;top:calc(var(--cp,4px)*-12 + 3px);width:calc(var(--cp,4px)*12);height:calc(var(--cp,4px)*12);image-rendering:pixelated}
#risali{left:14px;top:calc(env(safe-area-inset-top,0px) + 14px)}
.visco .v-anima{position:absolute;left:calc(var(--px)*104);bottom:calc(var(--px)*14);width:calc(var(--px)*28);height:calc(var(--px)*40);image-rendering:pixelated;pointer-events:none;opacity:.8;animation:animaSale 5s ease-in-out infinite}
@keyframes animaSale{0%{transform:translateY(calc(var(--px)*6));opacity:0}25%{opacity:.8}70%{opacity:.7}100%{transform:translateY(calc(var(--px)*-26));opacity:0}}
.visco .v-rip{position:absolute;left:calc(var(--px)*66);bottom:calc(var(--px)*70);font-family:var(--f-pixel);font-weight:700;font-size:calc(var(--px)*5);color:#c8d4ff;text-shadow:0 0 8px rgba(150,180,255,.8),0 2px 0 #000;letter-spacing:.1em;pointer-events:none;animation:fiamma 3s steps(1) infinite}
.visco .v-mosche{position:absolute;left:calc(var(--px)*108);bottom:calc(var(--px)*30);width:calc(var(--px)*24);height:calc(var(--px)*14);pointer-events:none}
.visco .v-mosche i{position:absolute;width:calc(var(--px)*1);height:calc(var(--px)*1);background:#050507;box-shadow:0 0 0 1px rgba(200,210,240,.35);animation:mosca 1.6s linear infinite}
.visco .v-mosche i:nth-child(2){animation-duration:2.1s;animation-delay:-.7s}.visco .v-mosche i:nth-child(3){animation-duration:1.3s;animation-delay:-1s}
@keyframes mosca{0%{transform:translate(0,50%)}25%{transform:translate(calc(var(--px)*20),0)}50%{transform:translate(calc(var(--px)*12),calc(var(--px)*12))}75%{transform:translate(calc(var(--px)*2),calc(var(--px)*6))}100%{transform:translate(0,50%)}}
@media (prefers-reduced-motion:reduce){.visco .v-anima,.visco .v-mosche i{animation:none}}
.visco .v-p,.visco .v-libro,.visco .v-nota{position:absolute;padding:0;border:0;background:none;cursor:pointer}
.visco .v-p{left:calc(var(--px)*94);bottom:calc(var(--px)*2);width:calc(var(--px)*42);height:calc(var(--px)*34)}
.visco .v-libro{left:calc(var(--px)*52);bottom:0;width:calc(var(--px)*22);height:calc(var(--px)*10)}

.omino .testa img{display:block;width:100%;height:100%;object-fit:cover;clip-path:ellipse(50% 50% at 50% 50%)}

.angelo{position:absolute;left:calc(var(--px)*13);top:calc(var(--px)*-46);width:calc(var(--px)*30);height:calc(var(--px)*30);z-index:3;pointer-events:none}
.angelo canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.angelo .alone-angelo{position:absolute;inset:calc(var(--px)*-12);border-radius:50%;background:radial-gradient(circle,rgba(255,246,210,.5),rgba(255,236,170,.12) 45%,transparent 68%)}
.raggio-cielo{position:absolute;left:calc(var(--px)*4);width:calc(var(--px)*48);bottom:calc(var(--px)*6);height:200vh;pointer-events:none;z-index:0;
  background:linear-gradient(to top,rgba(255,240,190,.55),rgba(255,240,190,.14) 35%,rgba(255,240,190,0) 80%);clip-path:polygon(0 0,100% 0,80% 100%,20% 100%);animation:fiamma 1.6s steps(1) infinite}
.fum-wrap{position:absolute;left:-220px;right:-220px;display:flex;justify-content:center;pointer-events:none;z-index:5}
.fum-wrap .fumetto{position:relative;left:auto;bottom:auto}
.fum-wrap .fumetto::after{left:calc(50% - 7px)}
.polvere{position:absolute;left:calc(var(--px)*27);bottom:calc(var(--px)*8);pointer-events:none;z-index:3}
.polvere i{position:absolute;left:0;top:0;width:calc(var(--px)*3);height:calc(var(--px)*3);background:#8a6a4a;animation:polvere .8s steps(8) forwards}
@keyframes polvere{from{transform:translate(0,0);opacity:.95}to{transform:translate(var(--dx),var(--dy)) scale(1.9);opacity:0}}

/* ---------- Gigirish ---------- */
#gigi{position:absolute;z-index:0;bottom:calc(var(--px)*(var(--suolo) - 3));width:calc(var(--px)*20);height:calc(var(--px)*30);cursor:pointer}
#gigi canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#gigi:focus-visible{outline:3px dashed var(--osso);outline-offset:4px}
.fumo{position:absolute;left:calc(var(--px)*13.5);top:calc(var(--px)*7.5);pointer-events:none}
.fumo i{position:absolute;left:0;top:0;width:calc(var(--px)*3);height:calc(var(--px)*3);background:#c9cdda;opacity:0;animation:fumo 3.6s steps(12) infinite}
.fumo i:nth-child(2){animation-delay:1.2s}.fumo i:nth-child(3){animation-delay:2.4s}
@keyframes fumo{0%{opacity:.6;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(calc(var(--px)*7),calc(var(--px)*-24)) scale(2.4)}}
#gigi-dice{z-index:3;pointer-events:none}
#gigi-dice.dx::after,#jediego .fumetto.dx::after,#terry .fumetto::after{left:auto;right:10px;clip-path:polygon(0 0,100% 0,100% 100%,80% 100%,80% 80%,60% 80%,60% 60%,40% 60%,40% 40%,20% 40%,20% 20%,0 20%)}

/* ---------- Jediego ---------- */
#jediego{position:absolute;z-index:2;bottom:calc(var(--px)*(var(--suolo) - 9));width:calc(var(--px)*24);height:calc(var(--px)*26);cursor:pointer}
#jediego canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#jediego:focus-visible{outline:3px dashed var(--osso);outline-offset:4px}
#jediego .alone-laser{position:absolute;left:calc(var(--px)*-12.5);top:calc(var(--px)*5);width:calc(var(--px)*28);height:calc(var(--px)*28);border-radius:50%;
  background:radial-gradient(circle,rgba(110,255,130,.38),rgba(80,220,110,.1) 45%,transparent 70%);animation:fiamma 1.3s steps(1) infinite;pointer-events:none}
#jediego .fumetto{left:calc(var(--px)*-6)}
#jediego.appare{animation:appare 1s steps(6)}
@keyframes appare{0%{opacity:0;filter:brightness(4)}40%{opacity:1;filter:brightness(2.5)}100%{opacity:1;filter:none}}

/* ---------- Donna Carmela ---------- */
#nonna{position:fixed;left:0;bottom:calc(var(--px)*(var(--suolo) - 13));z-index:2;width:calc(var(--px)*22);height:calc(var(--px)*32);transform:translateX(-200px);cursor:pointer}
#nonna:focus-visible{outline:3px dashed var(--osso);outline-offset:4px}
#nonna .corpo{position:absolute;inset:0}
#nonna .corpo.sx{transform:scaleX(-1)}
#nonna canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#nonna .alone-lumino{position:absolute;left:calc(var(--px)*-12);top:calc(var(--px)*3.5);width:calc(var(--px)*30);height:calc(var(--px)*30);border-radius:50%;
  background:radial-gradient(circle,rgba(255,190,90,.4),rgba(255,150,60,.12) 45%,transparent 70%);animation:fiamma 2.6s steps(1) infinite;pointer-events:none}
.fumetto{position:absolute;left:calc(var(--px)*9);bottom:calc(100% + 16px);width:max-content;max-width:min(240px,calc(100vw - 60px));display:flex;flex-direction:column;gap:4px;
  padding:9px 12px 10px;background:#efe6c8;color:#1d1a14;text-align:left;box-shadow:0 0 0 3px #06060b,0 6px 0 3px rgba(0,0,0,.35);
  font-family:var(--f-pixel);font-weight:700;font-size:15px;line-height:1.15}
.fumetto small{font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7a6542}
.fumetto::after{content:"";position:absolute;left:10px;top:100%;width:15px;height:15px;background:#efe6c8;
  clip-path:polygon(0 0,100% 0,100% 20%,80% 20%,80% 40%,60% 40%,60% 60%,40% 60%,40% 80%,20% 80%,20% 100%,0 100%)}
.fumetto.pop{animation:pop .35s steps(3)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
#chiama{left:14px;top:calc(env(safe-area-inset-top,0px) + 14px)}
#chiama canvas{width:32px;height:32px;image-rendering:pixelated}
#chiama .punto{position:absolute;right:-6px;top:-6px;width:12px;height:12px;background:#d8423a;box-shadow:0 0 0 3px #04050a;animation:lampeggia 1.2s steps(2) infinite}
#racconto,#interrogatorio,#chiedi,#dlg{position:fixed;inset:0;z-index:12;display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
#racconto .velo-r,#interrogatorio .velo-r,#chiedi .velo-r,#dlg .velo-r{position:absolute;inset:0;background:rgba(3,4,9,.55)}
.box-r{position:relative;width:min(600px,100%);display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:14px;background:#efe6c8;color:#1d1a14;
  box-shadow:inset 0 0 0 3px #cdbd92,0 0 0 3px #06060b,0 0 0 7px #6b4a2a,0 0 0 10px #06060b}
.r-ritratto{width:72px;height:72px;image-rendering:pixelated;background:#2a2433;box-shadow:0 0 0 3px #06060b}
.r-corpo{min-width:0}
.r-testa{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.r-testa h2{margin:0;font-family:var(--f-pixel);font-weight:700;font-size:18px}
#r-data,.r-data{font-family:var(--f-pixel);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7a6542}
.r-testo{white-space:pre-line;margin:6px 0 0;font-family:var(--f-testo);font-size:23px;line-height:1.03;max-height:42vh;overflow:auto;min-height:3.1em;cursor:pointer;user-select:text;-webkit-user-select:text}
.r-risposta{margin:8px 0 0;font-family:var(--f-testo);font-size:22px;line-height:1.03;color:#6b2a2a}
.r-azioni{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.r-btn{min-height:42px;padding:6px 12px;font-family:var(--f-pixel);font-weight:600;font-size:14px;color:#1d1a14;background:#d9cba1;box-shadow:inset 0 3px 0 #f4ead0,inset 0 -3px 0 #a8976c,0 0 0 3px #06060b}
.r-btn.primario{background:#5a3519;color:#f4ead0;box-shadow:inset 0 3px 0 #9a6638,inset 0 -3px 0 #2a1609,0 0 0 3px #06060b}
.r-btn:active{transform:translateY(2px)}
.r-btn:focus-visible{outline:3px dashed #1d1a14;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:440px){.box-r{gap:10px;padding:12px}.r-ritratto{width:52px;height:52px}.r-testo{font-size:21px}}
.z-info{transition:opacity .25s steps(3)}
.cambia .z-info{opacity:0}

/* ---------- il teatro comunale e la sala ---------- */
.teatro{position:relative;flex:none;width:calc(var(--px)*112);height:calc(var(--px)*92);margin-inline:calc(var(--px)*16) calc(var(--px)*10);z-index:1;cursor:pointer}
.teatro>canvas.fac{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.teatro .luce-teatro{position:absolute;left:calc(var(--px)*-14);top:calc(var(--px)*-24);width:calc(var(--px)*140);height:calc(var(--px)*130);border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 55%,rgba(255,120,40,.5),rgba(255,90,30,.16) 50%,transparent 72%);animation:fiamma 1.3s steps(1) infinite}
.teatro canvas.fiamme{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:1;pointer-events:none}
.teatro .vigile{position:absolute;left:calc(var(--px)*46);bottom:calc(var(--px)*3);width:calc(var(--px)*20);height:calc(var(--px)*32);image-rendering:pixelated;z-index:2;pointer-events:none}
.teatro .fumo-t{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:3}
.teatro .fumo-t i{position:absolute;width:calc(var(--px)*6);height:calc(var(--px)*6);background:#25252f;opacity:0;animation:fumoT 5s steps(14) infinite}
@keyframes fumoT{0%{opacity:.6;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(calc(var(--px)*16),calc(var(--px)*-54)) scale(3.2)}}
.teatro:hover .luce-teatro,.teatro:focus-visible .luce-teatro{filter:brightness(1.35)}
.teatro:focus-visible{outline:3px dashed var(--osso);outline-offset:4px}
.teatro .ombra{position:absolute;left:calc(var(--px)*72);bottom:calc(var(--px)*4);width:calc(var(--px)*22);height:calc(var(--px)*34);image-rendering:pixelated;visibility:hidden;z-index:2;pointer-events:none}
.teatro.ombra-su .ombra{visibility:visible;animation:spunta .5s steps(5) both}
@keyframes spunta{0%{transform:translateY(30%) scale(.7,.5);opacity:0}60%{transform:translateY(-6%) scale(1.05,1.1);opacity:1}100%{transform:none;opacity:1}}
#dlg{z-index:27}
#dlg.scuro .box-r{background:#1a1a26;color:#e8e6f0;box-shadow:inset 0 0 0 3px #3a3f66,0 0 0 3px #06060b,0 0 0 7px #2a2d4a,0 0 0 10px #06060b}
#dlg.scuro .r-ritratto{background:#14131c}
#dlg.scuro .r-data{color:#9aa0d0}
#dlg.scuro .r-btn{color:#e8e6f0;background:#2a2d44;box-shadow:inset 0 3px 0 #4a4f78,inset 0 -3px 0 #14152a,0 0 0 3px #06060b}
#dlg.scuro .r-btn.primario{background:#7a1522;box-shadow:inset 0 3px 0 #b02a3a,inset 0 -3px 0 #3d0910,0 0 0 3px #06060b}
#dlg.scuro .r-btn:focus-visible{outline-color:#e8e6f0}
#sala{position:fixed;inset:0;z-index:25;background:#0a0508;overflow:hidden}
#sala canvas#sala-cv{position:absolute;left:0;top:0;image-rendering:pixelated}
#film{position:absolute;display:block;background:#000;object-fit:contain;box-shadow:0 0 0 calc(var(--cp,4px)*1) #050508,0 0 calc(var(--cp,4px)*9) rgba(190,205,255,.35)}
#esci-sala{left:14px;top:calc(env(safe-area-inset-top,0px) + 14px)}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;cursor:pointer}
#intro canvas{position:absolute;left:0;top:0;image-rendering:pixelated}
.intro-testo{position:relative;margin-top:calc(env(safe-area-inset-top,0px) + 13vh);display:flex;flex-direction:column;align-items:center;text-align:center;padding-inline:16px}
.riga{display:block;font-family:var(--f-titolo);font-size:clamp(46px,14.5vw,112px);line-height:.92;color:var(--osso);opacity:0;
  text-shadow:0 0 24px rgba(150,165,255,.55),0 4px 0 #000}
.riga.picc{font-size:clamp(30px,9vw,70px)}
.riga.on{animation:accendi 1.8s forwards}
@keyframes accendi{0%{opacity:1;color:#fff;animation-timing-function:steps(1)}8%{opacity:.15;animation-timing-function:steps(1)}14%{opacity:1;animation-timing-function:steps(1)}22%{opacity:.4;animation-timing-function:steps(1)}30%{opacity:.95;color:var(--osso)}100%{opacity:.92}}
.intro-azioni{position:relative;margin-top:auto;margin-bottom:calc(var(--terra-intro,12vh) - var(--px)*3);width:100%;padding-inline:16px;display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity .4s steps(4)}
..bottoni-intro{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.intro-azioni.on{opacity:1}
#entra{font-family:var(--f-pixel);font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--osso);padding:11px 16px;
  background:#120d08;box-shadow:0 0 0 3px #3b2a18,0 0 0 6px #000;animation:lampeggia 1.1s steps(2) infinite}
#entra-muto{font-family:var(--f-pixel);font-size:13px;letter-spacing:.08em;color:#9a958a;text-decoration:underline;text-underline-offset:4px;padding:6px 2px}
#entra:focus-visible,#entra-muto:focus-visible{outline:3px dashed var(--osso);outline-offset:4px}
#nero{position:fixed;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none;transition:opacity .55s steps(7)}
#nero.on{opacity:1}

@media (prefers-reduced-motion:reduce){
  #hint,#entra,.prop .alone,#nonna .alone-lumino,#chiama .punto,.alone-lanterna,#jediego .alone-laser,#jediego.appare,.fumo i,.luce-fossa::before,.ic-2,.raggio-cielo,.vapore i,.luce-chiosco,.luce-teatro,.fumo-t i,.teatro.ombra-su .ombra{animation:none}
  #insegna.cala{animation:none}
  .riga.on{animation:none;opacity:.92}
}
</style>
</head>
<body>

<canvas id="fondo" class="scena" aria-hidden="true"></canvas>
<main id="cimitero" tabindex="-1" aria-label="Le lapidi del cimitero">
  <div id="fila"><div id="recinto"></div><div id="suolo"></div></div>
</main>
<canvas id="pioggia" class="scena" aria-hidden="true"></canvas>
<button id="nonna" type="button" hidden aria-label="Donna Carmela ha una notizia. Ascoltala">
  <span class="fumetto" id="fumetto" hidden><span id="fumetto-testo"></span><small>tocca per sentire</small></span>
  <span class="corpo"><span class="alone-lumino"></span><canvas id="nonna-cv" width="22" height="32"></canvas></span>
</button>
<div id="lampo" aria-hidden="true"></div>

<header id="insegna">
  <div class="catene" aria-hidden="true"><i></i><i></i></div>
  <div class="cartello">
    <div class="tavola"><h1>Gli amici di Giuleppe</h1><span class="chiodo a"></span><span class="chiodo b"></span><span class="chiodo c"></span><span class="chiodo d"></span></div>
  </div>
  <div class="targa">Cimitero di Giuleppe</div>
</header>

<button id="audio" class="btn-px" type="button" aria-label="Attiva pioggia e tuoni" aria-pressed="false">
  <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M1 4h2v4H1zM3 4h1V3h1V2h1v8H5V9H4V8H3z"/><g class="onde"><path fill="currentColor" d="M8 4h1v4H8zM10 3h1v6h-1z"/></g><g class="muto"><path fill="currentColor" d="M8 4h1v1H8zM10 4h1v1h-1zM9 5h1v2H9zM8 7h1v1H8zM10 7h1v1h-1z"/></g></svg>
</button>
<button id="sx" class="btn-px freccia" type="button" aria-label="Lapide precedente" hidden><svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M7 2h2v1H8v1H7v1H6v2h1v1h1v1h1v1H7V9H6V8H5V7H4V5h1V4h1V3h1z"/></svg></button>
<button id="dx" class="btn-px freccia" type="button" aria-label="Lapide successiva"><svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M3 2h2v1h1v1h1v1h1v2H7v1H6v1H5v1H3V9h1V8h1V7h1V5H5V4H4V3H3z"/></svg></button>
<div id="hint" aria-hidden="true">&larr; scorri tra le lapidi &rarr;</div>
<footer id="conta" aria-live="polite">Il becchino sta scavando&hellip;</footer>

<div id="zoom" hidden>
  <div class="velo"></div>
  <button id="chiudi" class="btn-px" type="button" aria-label="Torna al cimitero"><svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M2 2h2v1h1v1h2V3h1V2h2v2H9v1H8v2h1v1h1v2H8V9H7V8H5v1H4v1H2V8h1V7h1V5H3V4H2z"/></svg></button>
  <div class="scena-zoom">
    <div class="z-lapide" role="dialog" aria-modal="true" aria-labelledby="z-nome">
      <canvas class="pietra"></canvas>
      <span class="foto"></span>
      <div class="z-info">
        <div class="z-testo z-nome" id="z-nome"></div>
        <div class="z-testo z-causa"></div>
        <div class="z-testo z-motivo"><p></p></div>
        <div class="z-testo z-date"></div>
      </div>
    </div>
    <div class="z-azioni">
      <button id="fiore" class="btn-fiore" type="button"><canvas id="fiore-ico" width="5" height="7" aria-hidden="true"></canvas><span class="fiore-testo">Posa un fiore</span><span class="fiore-conta" id="fiore-conta">0</span></button>
    </div>
    <div class="z-nav">
      <button id="zprec" class="btn-px" type="button" aria-label="Lapide precedente"><svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M7 2h2v1H8v1H7v1H6v2h1v1h1v1h1v1H7V9H6V8H5V7H4V5h1V4h1V3h1z"/></svg></button>
      <span id="zpos">1 / 1</span>
      <button id="zsucc" class="btn-px" type="button" aria-label="Lapide successiva"><svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M3 2h2v1h1v1h1v1h1v2H7v1H6v1H5v1H3V9h1V8h1V7h1V5H5V4H4V3H3z"/></svg></button>
    </div>
  </div>
</div>

<div id="intro" role="dialog" aria-label="Ingresso al cimitero">
  <canvas id="intro-cv" aria-hidden="true"></canvas>
  <div class="intro-testo" aria-hidden="true">
    <span class="riga picc r1">Il cimitero</span>
    <span class="riga picc r2">degli amici</span>
    <span class="riga r3">di Giuleppe</span>
  </div>
  <div class="intro-azioni">
    <div class="bottoni-intro">
      <button id="entra" type="button">Apri il cancello</button>
      <button id="entra-muto" type="button">entra senza audio</button>
    </div>
  </div>
</div>
<button id="chiama" class="btn-px" type="button" hidden aria-label="Senti cosa racconta oggi Donna Carmela"><canvas id="chiama-cv" width="16" height="16" aria-hidden="true"></canvas><span class="punto" hidden></span></button>
<div id="racconto" hidden>
  <div class="velo-r"></div>
  <section class="box-r" role="dialog" aria-modal="true" aria-labelledby="r-nome">
    <canvas class="r-ritratto" id="r-ritratto" width="16" height="16" aria-hidden="true"></canvas>
    <div class="r-corpo">
      <header class="r-testa"><h2 id="r-nome">Donna Carmela</h2><span id="r-data"></span></header>
      <p class="r-testo" id="r-testo" aria-hidden="true"></p>
      <p class="sr" id="r-sr" aria-live="polite"></p>
      <p class="r-risposta" id="r-risposta" hidden></p>
      <div class="r-azioni">
        <button class="r-btn" id="r-perche" type="button">E Afragola che c'entra?</button>
        <button class="r-btn primario" id="r-chiudi" type="button">Grazie, Donna Carmela</button>
      </div>
    </div>
  </section>
</div>
<div id="chiedi" hidden>
  <div class="velo-r"></div>
  <section class="box-c" role="dialog" aria-modal="true" aria-labelledby="c-tit">
    <h2 id="c-tit">Dalla fossa esce una luce calda.</h2>
    <p>E un odore di caffè appena fatto. Vuoi entrare?</p>
    <div class="r-azioni"><button class="r-btn primario" id="c-si" type="button">Sì, entro</button><button class="r-btn" id="c-no" type="button">No, ho paura</button></div>
  </section>
</div>
<div id="caffe" hidden>
  <canvas id="caffe-cv" aria-hidden="true"></canvas>

function costruisciCancello(){

  for(let x=0;x<W;x++){const y=Math.round(suoloY+Math.sin(x*.05)*1.5+Math.sin(x*.13)*1);M.rett(x,y,1,H-y)}
  const GW=Math.min(W-16,Math.round(H*.55),150),GH=Math.round(GW*.62),xl=Math.round(cx-GW/2),xr=Math.round(cx+GW/2),pw=Math.max(7,Math.round(GW*.09));

  for(let k=0;k<7;k++){const x=Math.round(r()*W),w=6+Math.floor(r()*6),h=8+Math.floor(r()*8);if(x>xl-10&&x<xr+10)continue;for(let j=0;j<h;j++)for(let i=0;i<w;i++){const u=(i+.5-w/2)/(w/2),v=j-w/2;if(j>=w/2||u*u+(v/(w/2))**2<=1)M.set(x+i,suoloY-h+j)}}

  for(let x=xl;x<xr;x++){const y=Math.round(arco(x))+3;D.rett(x,y,1,2);D.set(x,suoloY-Math.round(GH*.3));D.set(x,suoloY-Math.round(GH*.3)+1);D.set(x,suoloY-4)}
  D.rett(Math.round(cx)-2,Math.round(arco(cx))-3,1,suoloY-Math.round(arco(cx))+3);D.rett(Math.round(cx)+1,Math.round(arco(cx))-3,1,suoloY-Math.round(arco(cx))+3);

function creaLapide(l,i){

function mostraLapidi(){
  fila.querySelectorAll('.lapide,.prop,.posto-libero,.vuoto,.risorto,.chiosco,.teatro,.visco,.veggente,.carmine').forEach(e=>e.remove());
  let i=0;
  TUTTE.forEach((l,k)=>{if(k===2)fila.append(Chiosco.crea());if(k===5)fila.append(Teatro.crea());if(k===8){fila.append(Veggente.crea());fila.append(Carmine.crea())}if(k>0)fila.append(creaProp(k,hash(l.id)+1));if(l.risorto)fila.append(Risurrezione.crea(l));else{fila.append(creaLapide(l,i));i++}});

  if(TUTTE.length<=5)fila.append(Teatro.crea());

function aggiornaConta(){

  const c=$('#conta');

async function carica(){
  try{
    const ac=new AbortController();const to=setTimeout(()=>ac.abort(),6000);
    const r=await fetch('/api/lapidi',{signal:ac.signal,headers:{accept:'application/json'},cache:'no-store'});clearTimeout(to);
    if(!r.ok)throw 0;const j=await r.json();if(!Array.isArray(j.lapidi))throw 0;TUTTE=j.lapidi;demo=false;
  }catch(e){TUTTE=SEED;demo=true}

    if(ridotto||k>=OFF_FIORI.length)return ok();
    const f=posFiore(l,true,k),c=spriteFiore(f.col,f.fh);c.className='fiore-volo';
    c.style.cssText=`left:calc(var(--zpx)*${f.x-2});top:calc(var(--zpx)*${f.yt-f.fh-3});width:calc(var(--zpx)*5);height:calc(var(--zpx)*${f.fh+3})`;
    zl.append(c);
    const z=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--zpx'))||4;
    c.animate([{transform:`translateY(${-z*46}px) rotate(-25deg)`,opacity:0},{transform:`translateY(${-z*30}px) rotate(15deg)`,opacity:1,offset:.35},{transform:`translateY(${-z*3}px) rotate(-6deg)`,offset:.85},{transform:'none'}],
      {duration:900,easing:'cubic-bezier(.3,.6,.4,1)'}).onfinish=()=>{c.remove();ok()};
  });
}
async function posaFiore(){
  const l=LAPIDI[zi];const b=$('#fiore');if(!l||b.disabled)return;
  if(giaPosato(l.id)){avviso('Hai già posato un fiore qui oggi. Torna domani.');return}
  b.disabled=true;let n=l.fiori||0,nuovo=true;
  if(demo)n++;
  else{
    try{const r=await fetch('/api/fiori/'+encodeURIComponent(l.id),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({v:VIS})});
      const j=await r.json();if(!r.ok)throw new Error(j.errore||'');n=j.fiori;nuovo=j.nuovo}
    catch(e){b.disabled=false;avviso('Il fiore non è arrivato. Riprova tra poco.');return}
  }
  segnaPosato(l.id);
  if(!nuovo){l.fiori=n;ridisegnaLapide(zi);aggiornaFiore();aggiornaConta();avviso('Hai già posato un fiore qui oggi. Torna domani.');return}
  Audio.campanella();
  await animaFiore(l,n-1);
  l.fiori=n;ridisegnaLapide(zi);aggiornaFiore();aggiornaConta();
  b.classList.remove('batte');void b.offsetWidth;b.classList.add('batte');
  avviso(demo?`Fiore posato per ${l.nome} (anteprima: non viene salvato).`:`Hai posato un fiore per ${l.nome}.`);
}
$('#fiore').addEventListener('click',posaFiore);

/* pittore: disegna sprite a regioni con ombre e contorno automatici */
function pittore(W,H){
  const R=new Uint8Array(W*H);
  const put=(x,y,r)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<W&&y<H)R[y*W+x]=r};
  const get=(x,y)=>x>=0&&y>=0&&x<W&&y<H?R[y*W+x]:0;
  return{put,get,
    disco(cx,cy,rr,r,ok){for(let y=Math.floor(cy-rr);y<=Math.ceil(cy+rr);y++)for(let x=Math.floor(cx-rr);x<=Math.ceil(cx+rr);x++)if((x-cx)**2+(y-cy)**2<=rr*rr+.3&&(!ok||ok(x,y)))put(x,y,r)},
    rett(x,y,w,h,r){for(let j=0;j<h;j++)for(let i=0;i<w;i++)put(x+i,y+j,r)},
    linea(x0,y0,x1,y1,sp,r){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;for(let a=0;a<sp;a++)for(let b=0;b<sp;b++)put(x+a,y+b,r)}},
    render(PAL){const p=Pix(W,H);
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){const r=get(x,y);
        if(!r){if(get(x-1,y)||get(x+1,y)||get(x,y-1)||get(x,y+1))p.set(x,y,'#06060b');continue}
        let t=1;if(get(x,y-1)!==r||get(x-1,y)!==r)t=2;else if(get(x,y+1)!==r||get(x+1,y)!==r)t=0;p.set(x,y,PAL[r][t])}
      return p}};
}

function animaDi(src,W,H){
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.drawImage(src,0,0);
  g.globalCompositeOperation='source-atop';g.fillStyle='rgba(170,200,255,.75)';g.fillRect(0,0,W,H);g.globalCompositeOperation='source-over';
  const id=g.getImageData(0,0,W,H),d=id.data;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;if(y>H*.55)d[i+3]=Math.round(d[i+3]*Math.max(0,1-(y-H*.55)/(H*.4)));}
  g.putImageData(id,0,0);g.fillStyle='#f2d35a';g.fillRect(W/2-5,0,10,1);g.fillRect(W/2-6,1,1,1);g.fillRect(W/2+5,1,1,1);return c;
}

    const p=Pix(W,H),fy=Math.round(H*.74),R=(x,y,w,h,c)=>{x=Math.round(x);y=Math.round(y);for(let j=0;j<h;j++)for(let i=0;i<w;i++)p.set(x+i,y+j,c)},lx=Math.round(W/2);
    for(let y=0;y<fy;y++)for(let x=0;x<W;x++){const row=Math.floor(y/4),off=(row%2)*4,malta=(y%4===3)||((x+off)%8===7);let c=malta?'#140c08':['#3a2418','#43291b','#33201a'][h2((x+off)>>3,row,3)%3];
      const d=Math.hypot((x-lx)/W,(y-fy*.2)/fy);if(bayer(x,y)<d*1.1-.15)c='#0c0806';p.set(x,y,c)}
    for(let y=fy;y<H;y++)for(let x=0;x<W;x++){let c=h2(x>>2,y>>1,5)%6===0?'#2a2420':'#3a322c';if(bayer(x,y)<Math.abs(x-lx)/W*1.2)c='#1a1512';if(y===fy)c='#5a4a3e';p.set(x,y,c)}
    for(let y=0;y<10;y++)p.set(lx,y,'#08080b');R(lx-1,10,3,2,'#2b2e38');R(lx-1,12,3,2,'#ffd27a');p.set(lx,13,'#fff1b8');
    for(let y=14;y<H;y++){const hw=(y-14)*.45+1;for(let x=Math.round(lx-hw);x<=lx+hw;x++){if(bayer(x,y)<(1-Math.abs(x-lx)/hw)*.22)p.set(x,y,y<fy?'#7a5434':'#6a5a48')}}
    // scaffale con sacchi di caffe'
    const sx=4,sw=Math.min(40,Math.round(W*.3));for(const yy of[Math.round(fy*.35),Math.round(fy*.65)]){R(sx,yy,sw,2,'#6b3f22');R(sx,yy+2,sw,1,'#2a1609');
      for(let x=sx+2;x<sx+sw-13;x+=15){R(x,yy-9,13,9,'#c8b48a');R(x,yy-9,13,1,'#e8d8b0');R(x+1,yy-10,11,1,'#a89470');incidi(p,'CAF',x+1,yy-7,1,'#5a3a1e')}}
    R(sx,Math.round(fy*.35),2,fy-Math.round(fy*.35),'#4a2c14');R(sx+sw-2,Math.round(fy*.35),2,fy-Math.round(fy*.35),'#4a2c14');
    // secchio e scopa
    const bx=W-14;R(bx,fy-7,8,7,'#8f939e');R(bx,fy-7,8,1,'#cfd4e0');R(bx+3,fy-30,1,24,'#8a6a42');for(let k=0;k<5;k++)R(bx+1+k,fy-6,1,4,'#c8b48a');
    R(W-30,fy-10,12,10,'#6b4a2a');R(W-30,fy-10,12,1,'#8a6a42');R(W-30,fy-5,12,1,'#4a2c14');
    cv.getContext('2d').drawImage(p.fine(),0,0);
    const a=$('#armadietto'),ax=Math.round(W/2-15),ay=fy-56+2;a.style.left=ax*cp+'px';a.style.top=ay*cp+'px';a.style.width=30*cp+'px';a.style.height=56*cp+'px';

/* ---------- Carmine, che parla solo tedesco ---------- */
function spriteCarmine(st){
  const P=pittore(20,32);
  // 1 cappellino verde 2 pelle 3 giacca 4 pantaloni 5 scarpe 6 sciarpa
  P.rett(6,24,3,6,4);P.rett(11,24,3,6,4);P.rett(5,30,4,2,5);P.rett(11,30,4,2,5);
  P.rett(4,12,12,12,3);P.rett(2,13,2,9,3);P.rett(16,13,2,9,3);P.rett(2,22,2,2,2);P.rett(16,22,2,2,2);
  P.rett(6,11,8,2,6);P.rett(8,13,3,4,6);
  P.disco(10,7,3.9,2);
  P.rett(6,2,8,3,1);P.rett(4,4,12,1,1);
  const p=P.render({1:['#1f4a2a','#2f6a3a','#4a8a54'],2:['#c48e72','#ecc3a5','#f8dcc6'],3:['#3a3e4a','#5d6273','#8a909e'],4:['#6a5a3e','#8a7652','#a8946a'],5:['#2a1a10','#3a2414','#5a3a24'],6:['#7a1f17','#c0392b','#e8624f']});
  p.set(13,1,'#c9a24a');p.set(14,0,'#c9a24a');p.set(15,0,'#e8e0c8');
  p.set(8,7,'#1b1a22');p.set(12,7,'#1b1a22');p.set(9,9,'#5a3a24');p.set(10,9,'#5a3a24');p.set(11,9,'#5a3a24');
  if(st==='parla'){p.set(10,10,'#5a1f24');p.set(11,10,'#5a1f24')}else p.set(10,10,'#9a5a4a');
  return p.fine();
}

function ritratto(cv,stato){const g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.fillStyle='#2a2433';g.fillRect(0,0,16,16);g.drawImage(NF[stato],3,0,16,16,0,0,16,16)}
const Nonna={
  oggi:oggiR(),custom:null,inScena:false,aperto:false,timer:null,
  el:$('#nonna'),cv:$('#nonna-cv'),
  disegna(st){const g=this.cv.getContext('2d');g.clearRect(0,0,22,32);g.drawImage(NF[st],0,0)},
  async carica(){
    try{const ac=new AbortController();const to=setTimeout(()=>ac.abort(),5000);
      const r=await fetch('/api/vecchietta',{signal:ac.signal,cache:'no-store'});clearTimeout(to);
      if(r.ok){const j=await r.json();if(j.oggi)this.oggi=j.oggi;this.custom=j.racconto||null}}catch(e){}
  },
  storia(){const nomi=LAPIDI.map(l=>l.nome);if(!window.NONNA)return'Oggi non tengo niente da dire. Torna domani.';
    return this.custom?NONNA.riempi(this.custom,this.oggi,nomi):NONNA.storiaDelGiorno(this.oggi,nomi)},
  letta(){try{return localStorage.getItem('giuleppe-nonna')===this.oggi}catch(e){return false}},
  segna(){try{localStorage.setItem('giuleppe-nonna',this.oggi)}catch(e){}},
  cammina(da,a,ms,sx){
    return new Promise(ok=>{
      this.el.querySelector('.corpo').classList.toggle('sx',!!sx);
      if(ridotto){this.el.style.transform=`translateX(${a}px)`;this.disegna('fermo');return ok()}
      let f=0;const t=setInterval(()=>{f^=1;this.disegna(f?'passo':'fermo')},210);
      const an=this.el.animate([{transform:`translateX(${da}px)`},{transform:`translateX(${a}px)`}],{duration:ms,easing:'linear',fill:'forwards'});
      an.onfinish=()=>{clearInterval(t);this.disegna('fermo');this.el.style.transform=`translateX(${a}px)`;an.cancel();this.el.querySelector('.corpo').classList.remove('sx');ok()};
    });
  },
  fumetto(testo,ms){const f=$('#fumetto');$('#fumetto-testo').textContent=testo;f.querySelector('small').hidden=!!ms;f.hidden=false;f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop');
    clearTimeout(this.ft);if(ms)this.ft=setTimeout(()=>{f.hidden=true},ms)},
  async arriva(){
    if(this.inScena)return;this.inScena=true;$('#chiama').hidden=true;
    const w=S.px*22;this.disegna('fermo');this.el.hidden=false;
    await this.cammina(-w-20,12,3400,false);
    if(!this.aperto&&!Risurrezione.inCorso)this.fumetto(NONNA.scegli(NONNA.saluti,this.oggi,5));
    Audio.blip();
    setTimeout(()=>Jediego.arriva(),6000);
    setTimeout(()=>Angioletto.arriva(),14000);
  },
  async parte(){
    if(!this.inScena)return;$('#fumetto').hidden=true;
    await this.cammina(12,-S.px*22-20,2600,true);
    this.el.hidden=true;this.inScena=false;this.mostraChiama();
  },
  mostraChiama(){const c=$('#chiama');c.hidden=false;c.querySelector('.punto').hidden=this.letta()},
  parla(on){clearInterval(this.pt);const rr=$('#r-ritratto');

  },
  scrivi(el,testo,fine){
    clearInterval(this.tw);el.textContent='';

    let i=0;this.parla(true);
    this.fine=()=>{clearInterval(this.tw);this.tw=null;el.textContent=testo;this.parla(false);fine&&fine();this.fine=null};
    this.tw=setInterval(()=>{i=Math.min(testo.length,i+2);el.textContent=testo.slice(0,i);if(i%6<2)Audio.blip();if(i>=testo.length)this.fine&&this.fine()},34);
  },
  chiudi(){
    if(this.fine)this.fine();clearInterval(this.pt);

  },
  inizio(){if(this.letta()){this.mostraChiama();setTimeout(()=>Jediego.arriva(),2500);setTimeout(()=>Angioletto.arriva(),9000)}else this.arriva()}
